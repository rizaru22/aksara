name: Laravel Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run test suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  mariadb-migration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: aksara-test
          MARIADB_DATABASE: aksara_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_mysql, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Prepare legacy journal status table
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aksara_test
          DB_USERNAME: root
          DB_PASSWORD: aksara-test
        run: |
          php -r '$pdo = new PDO("mysql:host=127.0.0.1;dbname=aksara_test", "root", "aksara-test"); $pdo->exec("CREATE TABLE jurnal_mengajars (id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY, status_sesi ENUM(\\'berlangsung\\', \\'selesai\\', \\'flagged\\') NOT NULL DEFAULT \\'berlangsung\\', created_at TIMESTAMP NULL, updated_at TIMESTAMP NULL)"); $pdo->exec("INSERT INTO jurnal_mengajars (status_sesi) VALUES (\\'berlangsung\\'), (\\'selesai\\'), (\\'flagged\\')");'

      - name: Run E-Jurnal status migration on MariaDB 10.6
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aksara_test
          DB_USERNAME: root
          DB_PASSWORD: aksara-test
        run: php artisan migrate --path=database/migrations/2026_10_23_000001_expand_jurnal_status_sesi_for_four_stage_workflow.php --force

      - name: Verify legacy status conversion
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aksara_test
          DB_USERNAME: root
          DB_PASSWORD: aksara-test
        run: |
          php -r '$app = require "bootstrap/app.php"; $app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap(); $statuses = Illuminate\\Support\\Facades\\DB::table("jurnal_mengajars")->orderBy("id")->pluck("status_sesi")->all(); if ($statuses !== ["draft", "final", "draft"]) { fwrite(STDERR, json_encode($statuses)); exit(1); } echo "Legacy statuses normalized correctly\\n";'
