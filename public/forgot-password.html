<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Reset Kata Sandi â€” AKSARA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body{min-height:100vh;background:#eff7f8;display:grid;place-items:center}.auth-card{max-width:440px;border:0;border-radius:24px;box-shadow:0 20px 60px #123f4b18}.brand{background:#06434b;color:#fff;border-radius:24px 24px 0 0;padding:24px;font-weight:800;font-size:25px}.form-control{min-height:46px}</style>
</head>
<body><main class="container px-3"><div class="card auth-card mx-auto"><header class="brand"><i class="bi bi-book-half text-info"></i> AKSARA</header><div class="card-body p-4"><h1 class="h4">Lupa kata sandi?</h1><p class="text-secondary small">Masukkan email akun. Jika email terdaftar, kami akan mengirim tautan untuk mengatur ulang kata sandi.</p><div id="notice" class="alert d-none" role="status"></div><form id="form"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" autocomplete="email" required></div><button class="btn btn-success w-100">Kirim tautan reset</button></form><p class="text-center small mt-3 mb-0"><a href="index.html">Kembali ke halaman masuk</a></p></div></div></main>
<script>
const form=document.getElementById('form');
const button=form.querySelector('button');
const box=document.getElementById('notice');
form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    if(button.disabled)return;
    button.disabled=true;
    button.textContent='Mengirim…';
    box.className='alert d-none';
    box.textContent='';
    try{
        const response=await fetch('/api/v1/auth/forgot-password',{
            method:'POST',
            headers:{Accept:'application/json','Content-Type':'application/json'},
            body:JSON.stringify({email:document.getElementById('email').value.trim()})
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.message||`Permintaan gagal (HTTP ${response.status}). Coba lagi nanti.`);
        box.className='alert alert-info';
        box.textContent=data.message||'Jika alamat terdaftar, tautan reset akan dikirim ke email tersebut.';
    }catch(error){
        box.className='alert alert-danger';
        box.textContent=error.message||'Tidak dapat menghubungi server. Periksa koneksi lalu coba lagi.';
    }finally{
        button.disabled=false;
        button.textContent='Kirim tautan reset';
    }
});
</script></body></html>
