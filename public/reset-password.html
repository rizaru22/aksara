<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Buat Kata Sandi Baru — AKSARA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body{min-height:100vh;background:#eff7f8;display:grid;place-items:center}.auth-card{max-width:440px;border:0;border-radius:24px;box-shadow:0 20px 60px #123f4b18}.brand{background:#06434b;color:#fff;border-radius:24px 24px 0 0;padding:24px;font-weight:800;font-size:25px}.form-control{min-height:46px}</style>
</head>
<body><main class="container px-3"><div class="card auth-card mx-auto"><header class="brand"><i class="bi bi-book-half text-info"></i> AKSARA</header><div class="card-body p-4"><h1 class="h4">Buat kata sandi baru</h1><p class="text-secondary small">Gunakan sekurangnya 12 karakter.</p><div id="notice" class="alert d-none" role="status"></div><form id="form"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Kata sandi baru</label><input class="form-control" type="password" id="password" minlength="12" autocomplete="new-password" required></div><div class="mb-3"><label class="form-label" for="confirmation">Ulangi kata sandi</label><input class="form-control" type="password" id="confirmation" minlength="12" autocomplete="new-password" required></div><button class="btn btn-success w-100">Simpan kata sandi</button></form><p class="text-center small mt-3 mb-0"><a href="index.html">Kembali ke halaman masuk</a></p></div></div></main>
<script>const parts=location.pathname.split('/');const token=decodeURIComponent(parts.at(-1)||'');document.getElementById('email').value=new URLSearchParams(location.search).get('email')||'';document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();const box=document.getElementById('notice');const password=document.getElementById('password').value;try{const r=await fetch('/api/v1/auth/reset-password',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({token,email:document.getElementById('email').value,password,password_confirmation:document.getElementById('confirmation').value})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Tautan reset tidak valid.');box.className='alert alert-success';box.textContent=d.message;setTimeout(()=>location.replace('/index.html'),1500);}catch(err){box.className='alert alert-danger';box.textContent=err.message;}});</script></body></html>
